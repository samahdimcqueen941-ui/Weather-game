
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Sandbox</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: #101827;
  text-align: center;
}
header { padding: 20px; background: #17243a; }
h1 { margin: 0 0 8px; }
#world {
  height: 55vh;
  min-height: 300px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(#64b5e8, #d7efff);
  transition: background 1s;
}
#sun {
  position: absolute;
  top: 35px;
  right: 12%;
  font-size: 65px;
}
#clouds {
  position: absolute;
  top: 65px;
  left: 10%;
  font-size: 60px;
}
#ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 22%;
  background: #55a653;
  transition: background 1s;
}
#particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.particle {
  position: absolute;
  top: -30px;
  animation: fall linear infinite;
}
.rain {
  width: 2px;
  height: 17px;
  background: #d8f2ff;
}
.snow {
  color: white;
  font-size: 15px;
}
@keyframes fall {
  to { transform: translate(35px, 65vh); }
}
.panel { padding: 20px; }
button, input {
  margin: 6px;
}
button {
  border: 0;
  border-radius: 8px;
  padding: 12px 16px;
  background: #294565;
  color: white;
  cursor: pointer;
}
button:hover { background: #3d638e; }
input { accent-color: #56b4ff; }
#readings { font-size: 18px; margin: 15px; }
</style>
</head>
<body>
<header>
  <h1>🌦️ Weather Sandbox</h1>
  <p>Experiment with your own virtual weather!</p>
</header>

<div id="world">
  <div id="sun">☀️</div>
  <div id="clouds">☁️ ☁️</div>
  <div id="particles"></div>
  <div id="ground"></div>
</div>

<div class="panel">
  <h2 id="weatherName">Sunny</h2>
  <div id="readings">
    Temperature: <span id="tempValue">25</span>°C
  </div>

  <label>
    Temperature:
    <input id="temperature" type="range"
      min="-20" max="45" value="25">
  </label>
  <p>
    <button onclick="setWeather('sunny')">☀️ Sunny</button>
    <button onclick="setWeather('cloudy')">☁️ Cloudy</button>
    <button onclick="setWeather('rain')">🌧️ Rain</button>
    <button onclick="setWeather('snow')">❄️ Snow</button>
    <button onclick="setWeather('storm')">⛈️ Thunderstorm</button>
    <button onclick="setWeather('wind')">💨 Wind</button>
  </p>
  <p>
    <button onclick="setWeather('tornado')">🌪️ Tornado</button>
    <button onclick="setWeather('hurricane')">🌀 Hurricane</button>
    <button onclick="resetWorld()">↻ Reset</button>
  </p>
</div>

<script>
const world = document.getElementById("world");
const ground = document.getElementById("ground");
const particles = document.getElementById("particles");
const sun = document.getElementById("sun");
const clouds = document.getElementById("clouds");
const weatherName = document.getElementById("weatherName");
const temperature = document.getElementById("temperature");
const tempValue = document.getElementById("tempValue");

let particleTimer;

temperature.addEventListener("input", () => {
  tempValue.textContent = temperature.value;
});

function clearParticles() {
  clearInterval(particleTimer);
  particles.innerHTML = "";
}

function makeParticle(type) {
  const p = document.createElement("div");
  p.className = "particle " + type;

  if (type === "rain") {
    p.classList.add("rain");
  } else {
    p.textContent = type === "snow" ? "❄" :
      type === "tornado" ? "🌀" :
      type === "hurricane" ? "🌀" : "🍃";
  }

  p.style.left = Math.random() * 100 + "%";
  p.style.animationDuration =
    (type === "snow" ? 3 + Math.random() * 4 :
     type === "rain" ? 0.5 + Math.random() * 0.7 :
     2 + Math.random() * 3) + "s";

  particles.appendChild(p);
  setTimeout(() => p.remove(), 8000);
}

function startParticles(type, amount) {
  clearParticles();
  for (let i = 0; i < amount; i++) {
    setTimeout(() => makeParticle(type), i * 30);
  }
  particleTimer = setInterval(() => {
    makeParticle(type);
  }, type === "rain" ? 30 : 150);
}

function setWeather(type) {
  clearParticles();
  sun.style.display = "block";
  clouds.style.display = "block";
  ground.style.background = "#55a653";
  world.style.background =
    "linear-gradient(#64b5e8, #d7efff)";

  const settings = {
    sunny: {
      name: "Sunny", sun: "☀️", clouds: "",
      bg: "linear-gradient(#168bd2,#b9e9ff)",
      ground: "#55a653"
    },
    cloudy: {
      name: "Cloudy", sun: "☁️", clouds: "☁️ ☁️ ☁️",
      bg: "linear-gradient(#788b9c,#c4ced5)",
      ground: "#65845b"
    },
    rain: {
      name: "Rain", sun: "🌧️", clouds: "☁️ ☁️",
      bg: "linear-gradient(#526a80,#a4b7c8)",
      ground: "#466c49"
    },
    snow: {
      name: "Snow", sun: "❄️", clouds: "☁️ ☁️",
      bg: "linear-gradient(#849bb2,#e5f3ff)",
      ground: "#edf5ff"
    },
    storm: {
      name: "Thunderstorm", sun: "⛈️", clouds: "☁️ ☁️",
      bg: "linear-gradient(#222b43,#69788b)",
      ground: "#394d3e"
    },
    wind: {
      name: "Windy", sun: "💨", clouds: "☁️",
      bg: "linear-gradient(#75a6c8,#d0e4ec)",
      ground: "#71995a"
    },
    tornado: {
      name: "Tornado", sun: "🌪️", clouds: "☁️ ☁️",
      bg: "linear-gradient(#58626b,#b4b7b4)",
      ground: "#777e52"
    },
    hurricane: {
      name: "Hurricane", sun: "🌀", clouds: "☁️ ☁️",
      bg: "linear-gradient(#344b65,#8195a5)",
      ground: "#536b58"
    }
  };

  const s = settings[type];
  weatherName.textContent = s.name;
  sun.textContent = s.sun;
  clouds.textContent = s.clouds;
  world.style.background = s.bg;
  ground.style.background = s.ground;

  if (type === "sunny") {
    clouds.style.display = "none";
  }
  if (type === "cloudy") {
    sun.style.display = "none";
  }
  if (type === "rain") startParticles("rain", 100);
  if (type === "snow") startParticles("snow", 50);
  if (type === "storm") startParticles("rain", 160);
  if (type === "wind") startParticles("wind", 35);
  if (type === "tornado") startParticles("tornado", 20);
  if (type === "hurricane") startParticles("hurricane", 35);
}

function resetWorld() {
  temperature.value = 25;
  tempValue.textContent = "25";
  setWeather("sunny");
}

setWeather("sunny");
</script>
</body>
</html>
